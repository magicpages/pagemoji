name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          push: true
          tags: |
            ghcr.io/magicpages/pagemoji:${{ github.ref_name }}
            ghcr.io/magicpages/pagemoji:latest

  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      # Node 25+ no longer ships corepack.
      - run: npm install --global pnpm@10.12.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run test
      # Trusted publishing: npm exchanges the job's OIDC token for a short-lived publish token
      # and attaches provenance on its own.
      - run: npm publish --access public
        working-directory: packages/widget
